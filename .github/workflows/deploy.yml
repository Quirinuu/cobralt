name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          timeout: 120000
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            **/*.sql
            config.php
            config.local.php

      - name: Aplicar migrações pendentes
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://cobralt.com.br/"
